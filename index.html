<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoPiano MIDI to Sheet</title>
<style>
  :root {
    --bg: #12121a; --panel: #1c1c28; --item: #262634; --text: #ebebf5; --muted: #9696ac;
    --accent: #ffb6d0; --accent-text: #281820;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; color: var(--accent); }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .drop {
    border: 1px dashed var(--accent); border-radius: 12px; padding: 28px; text-align: center;
    background: var(--panel); cursor: pointer; transition: background .15s;
  }
  .drop.over { background: #2a2030; }
  .drop strong { color: var(--accent); }
  input[type=file] { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0; }
  label.f { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  input[type=number] {
    width: 110px; padding: 8px 10px; border-radius: 8px; border: 0; background: var(--panel);
    color: var(--text); font: inherit;
  }
  label.chk { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  button {
    padding: 9px 16px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--item); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  textarea {
    width: 100%; height: 320px; resize: vertical; border: 0; border-radius: 10px; padding: 12px;
    background: var(--panel); color: var(--text); font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  #info { color: var(--muted); margin: 8px 0 12px; min-height: 21px; }
  #info b { color: var(--text); }
  .err { color: #ff7a8a !important; }
</style>
</head>
<body>
<main>
  <h1>AutoPiano - MIDI to Sheet</h1>
  <p class="sub">Tải file MIDI lên, nhận script Lua keypress / rest / finishedSong cho AutoPiano (Virtual Piano 61 phím, C2-C7).</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".mid,.midi,audio/midi">
    <div><strong>Chọn file MIDI</strong> hoặc kéo thả vào đây</div>
    <div id="fname" style="color:var(--muted);margin-top:6px"></div>
  </label>

  <div class="row">
    <label class="f">BPM<input type="number" id="bpm" min="20" max="400" value="120"></label>
    <label class="f">Transpose (nửa cung)<input type="number" id="transpose" min="-48" max="48" value="0"></label>
    <label class="chk" style="align-self:flex-end"><input type="checkbox" id="fold" checked> Gập nốt ngoài dải vào C2-C7</label>
    <label class="chk" style="align-self:flex-end"><input type="checkbox" id="hold"> Giữ nốt theo độ dài</label>
  </div>

  <div class="row">
    <button class="primary" id="convert" disabled>Convert</button>
    <button id="copy" disabled>Copy</button>
    <button id="download" disabled>Download .txt</button>
  </div>

  <div id="info"></div>
  <textarea id="out" spellcheck="false" placeholder="Sheet sẽ hiện ở đây..."></textarea>
</main>

<script src="midi61.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let midi = null, fileName = "song";

  function setInfo(html, isErr) {
    $("info").innerHTML = html;
    $("info").classList.toggle("err", !!isErr);
  }

  async function loadFile(f) {
    if (!f) return;
    try {
      midi = Midi61.parseMidi(await f.arrayBuffer());
      fileName = f.name.replace(/\.[^.]+$/, "").replace(/[^\w\- ]+/g, "") || "song";
      $("fname").textContent = f.name;
      $("bpm").value = midi.firstBpm || 120;
      $("convert").disabled = false;
      setInfo("Đọc được <b>" + midi.notes.length + "</b> nốt, dài <b>" + midi.duration.toFixed(1) + "s</b>, tempo gốc <b>" + midi.firstBpm + "</b> BPM.");
      convert();
    } catch (e) {
      midi = null;
      $("convert").disabled = true;
      setInfo("Không đọc được file: " + e.message, true);
    }
  }

  function convert() {
    if (!midi) return;
    const r = Midi61.midiToSheet(midi, {
      bpm: $("bpm").value,
      transpose: $("transpose").value,
      fold: $("fold").checked,
      hold: $("hold").checked,
    });
    $("out").value = r.sheet;
    $("copy").disabled = $("download").disabled = false;
    setInfo("<b>" + r.stats.groups + "</b> dòng keypress từ <b>" + r.stats.notes + "</b> nốt"
      + " | BPM <b>" + r.bpm + "</b>"
      + " | gập quãng tám: <b>" + r.stats.folded + "</b>"
      + " | bỏ (ngoài dải): <b>" + r.stats.dropped + "</b>");
  }

  $("file").addEventListener("change", (e) => loadFile(e.target.files[0]));
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => loadFile(e.dataTransfer.files[0]));

  $("convert").addEventListener("click", convert);
  ["bpm", "transpose", "fold", "hold"].forEach((id) => $(id).addEventListener("change", convert));

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("out").value); }
    catch (e) { $("out").select(); document.execCommand("copy"); }
    $("copy").textContent = "Copied";
    setTimeout(() => ($("copy").textContent = "Copy"), 1200);
  });

  $("download").addEventListener("click", () => {
    const url = URL.createObjectURL(new Blob([$("out").value], { type: "text/plain" }));
    const a = document.createElement("a");
    a.href = url; a.download = fileName + ".txt"; a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
